
<!DOCTYPE html>
<html lang='id'>
<head>
    <meta charset='UTF-8'>
    <title>Profil Sekolah</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background: white;
            color: black;
        }

        body.gelap {
            background: #1e1e1e;
            color: #f5f5f5;
        }

        #info {
            background: #eeeeee;
            color: black;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }

        body.gelap #info {
            background: #333333;
            color: white;
        }
    </style>
</head>
<body>
    <h1>SMK Maju Jaya</h1>
    <p>Jurusan Rekayasa Perangkat Lunak.</p>

    <button id='btnTema'>Mode Gelap</button>
    <br>
    <br>
    <div id='info'>
        <h3>Informasi Sekolah</h3>
        <p>Selamat datang di SMK Maju Jaya.</p>
        <p>Belajar, Berkarya, dan Berprestasi.</p>
    </div>

    <script>
        const btnTema = document.getElementById('btnTema');

        btnTema.addEventListener('click', () => {
            document.body.classList.toggle('gelap');

            if (document.body.classList.contains('gelap')) {
                btnTema.textContent = 'Mode Terang';
            } else {
                btnTema.textContent = 'Mode Gelap';
            }
        });
    </script>
</body>
</html>
