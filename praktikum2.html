<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    #angka { font-size: 64px; }
    button { font-size: 20px; margin: 5px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h2>Counter</h2>
  <div id="angka">0</div>
  <button id="tambah">+ tambah</button>
  <button id="kurang">- kurang</button>
  <button id="reset">reset</button>

  <script>
    let hitung = 0;
    const angka = document.getElementById('angka');

    document.getElementById('tambah').addEventListener('click', () => {
      hitung = hitung + 1;
      angka.textContent = hitung;
      angka.style.color = hitung > 0 ? 'green' : hitung < 0 ? 'red' : 'black';
    });

    document.getElementById('kurang').addEventListener('click', () => {
      if (hitung > 0) {
        hitung = hitung - 1;
        angka.textContent = hitung;
        angka.style.color = hitung > 0 ? 'green' : hitung < 0 ? 'red' : 'black';
      }
    });

    document.getElementById('reset').addEventListener('click', () => {
      hitung = 0;
      angka.textContent = hitung;
      angka.style.color = 'black';
    });
  </script>
</body>
</html>
